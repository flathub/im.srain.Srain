id: im.srain.Srain
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: srain
finish-args:
  - --share=ipc
  - --filesystem=home:ro
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --talk-name=org.freedesktop.secrets
cleanup:
  - /include
  - /lib/cmake
  - /lib/girepository-1.0
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala
  - '*.la'
modules:

  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: libconfig
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://hyperrealm.github.io/libconfig/dist/libconfig-1.8.1.tar.gz
        sha256: c73ee3d914ec68c99b61e864832931e9a7112eeabfb449dad217fd83e385cbdf

  - name: srain
    buildsystem: meson
    config-opts:
      - -Ddoc_builders=[]
      - --buildtype=release
    sources:
      - type: git
        url: https://github.com/SrainApp/srain.git
        tag: 1.8.1
        commit: 693c81b11052b6e287b5a734352dd813ef2b71aa
